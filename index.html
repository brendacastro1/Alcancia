    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:32px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand svg{flex-shrink:0;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    margin:0;
    color:var(--primary-dark);
  }
  .brand p{margin:2px 0 0;color:var(--text-secondary);font-size:14px;}
  .add-btn{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:12px 22px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background 0.15s ease;
  }
  .add-btn:hover{background:var(--primary-dark);}
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:20px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    position:relative;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card.dragging{opacity:0.5;}
  .card.drag-over{outline:2px dashed var(--primary);outline-offset:2px;}
  .star-btn{
    position:absolute;top:14px;right:14px;background:none;border:none;
    cursor:pointer;color:var(--border);padding:4px;z-index:2;
  }
  .star-btn svg{display:block;}
  .star-btn:hover{color:var(--primary-light);}
  .star-btn.active{color:#e3b23c;}
  .sparkline{margin-top:10px;line-height:0;}
  .sparkline svg{display:block;width:100%;height:32px;}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,111,160,0.18);}
  .card-photo{
    width:56px;height:56px;border-radius:50%;
    background:var(--primary-pale);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;margin-bottom:14px;
    color:var(--primary);
  }
  .card-photo img{width:100%;height:100%;object-fit:cover;}
  .card-name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0 0 4px;}
  .card-balance{font-size:24px;font-weight:600;font-family:'Fraunces',serif;}
  .card-balance.neg{color:var(--expense);}
  .card-count{color:var(--text-secondary);font-size:13px;margin-top:6px;}
  .progress-bar{height:7px;border-radius:999px;background:var(--primary-pale);overflow:hidden;margin-top:10px;}
  .progress-fill{height:100%;background:var(--primary);border-radius:999px;}
  .goal-label{font-size:12px;color:var(--text-secondary);margin-top:6px;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-secondary);
  }
  .empty svg{margin-bottom:12px;color:var(--primary-light);}
  .empty p{margin:4px 0;}
  .empty p.big{font-family:'Fraunces',serif;font-size:20px;color:var(--text);}

  .archived-toggle{margin:28px 0 8px;}
  .archived-toggle summary{
    cursor:pointer;color:var(--text-secondary);font-size:14px;font-weight:600;
    list-style:none;
  }
  .archived-toggle summary::-webkit-details-marker{display:none;}
  .archived-toggle summary::before{content:'▸ ';}
  .archived-toggle[open] summary::before{content:'▾ ';}
  .archived-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:14px;margin-top:14px;
  }
  .archived-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px;opacity:0.75;
  }
  .archived-card .card-name{font-size:16px;}
  .restore-btn{
    margin-top:10px;width:100%;padding:8px;border-radius:10px;
    border:1px solid var(--border);background:#fff;color:var(--primary-dark);
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .restore-btn:hover{background:var(--primary-pale);}

  .overlay{
    position:fixed;inset:0;
    background:rgba(59,30,43,0.35);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:22px;
    padding:28px;
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    position:relative;
  }
  .modal.wide{max-width:560px;}
  .modal h2{
    font-family:'Fraunces',serif;
    font-size:22px;
    margin:0 0 18px;
    color:var(--primary-dark);
  }
  label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],input[type=month]{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:12px;
